[package]
name = "enuminfo"
version = "0.1.0"
edition = "2024"
authors = ["Dante Doménech <dante19031999@gmail.com>"]
description = "Procedural derive macros and traits for Rust enums providing boolean checkers, string conversions, name lookup, variant slices, and casing transformations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dante19031999/enuminfo"
homepage = "https://github.com/dante19031999/enuminfo"
readme = "README.md"
keywords = ["enum", "derive", "casing", "lookup", "macro"]
categories = ["rust-patterns", "development-tools::procedural-macro-helpers", "data-structures"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[features]
default = ["from-str"]
"from-str" = ["enuminfo_macros/from-str"]
"skip-inherent" = ["enuminfo_macros/skip-inherent"]

[dependencies]
enuminfo_macros = { version = "0.1.0", git = "https://github.com/dante19031999/enuminfo-macros", features = ["impl-enuminfo"] }